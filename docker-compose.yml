# XploAds local / single-VPS stack.
#   cp .env.example .env    # then edit secrets
#   docker compose up -d --build
#   open http://localhost:8080
# Staging/production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: xploads

x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/backend.Dockerfile
    target: runtime
  image: xploads-backend:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://xploads_app:${XPLOADS_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
    MIGRATION_DATABASE_URL: postgresql+psycopg://xploads_owner:${XPLOADS_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://storage:8333
    S3_FORCE_PATH_STYLE: "true"
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      XPLOADS_OWNER_PASSWORD: ${XPLOADS_OWNER_PASSWORD}
      XPLOADS_APP_PASSWORD: ${XPLOADS_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage for brand assets (SeaweedFS). In production point S3_* at AWS S3 or
  # Cloudflare R2 instead and remove this service (see docs/deployment/DEPLOYMENT.md).
  storage:
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-s3", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      # Browsers upload and download through signed URLs on this port (S3_PUBLIC_ENDPOINT_URL).
      - "${STORAGE_PORT:-8333}:8333"
    volumes:
      - storagedata:/data
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli ensure-storage"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_started }

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2",
              "-Q", "default,notifications,webhook_processing,lead_processing,analytics_sync,billing_reconciliation"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 >/dev/null"]
      interval: 60s
      timeout: 15s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    image: xploads-web:local
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/proxy_params_xploads:/etc/nginx/proxy_params_xploads:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storagedata:
