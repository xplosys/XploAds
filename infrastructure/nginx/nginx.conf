# Reverse proxy: / -> Next.js, /api and /health -> FastAPI.
# TLS: in production mount certificates (Let's Encrypt via certbot) and enable the 443 server below.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  client_max_body_size 2m;          # raised per-location for media uploads in Phase 2
  proxy_read_timeout 60s;

  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"duration":$request_time,"request_id":"$request_id","ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

  upstream api { server api:8000; keepalive 16; }
  upstream web { server web:3000; keepalive 16; }

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Uncomment once HTTPS is live:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/v1/auth/ {
      limit_req zone=auth burst=20 nodelay;
      include /etc/nginx/proxy_params_xploads;
      proxy_pass http://api;
    }

    location /api/ {
      include /etc/nginx/proxy_params_xploads;
      proxy_pass http://api;
    }

    location /health/ {
      include /etc/nginx/proxy_params_xploads;
      proxy_pass http://api;
    }

    location / {
      include /etc/nginx/proxy_params_xploads;
      proxy_pass http://web;
    }
  }
}
